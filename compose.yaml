services:
  mlflow:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gridvision-backend:latest
    container_name: gridvision-mlflow
    restart: unless-stopped
    command:
      - python
      - -m
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - file:///mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5001"
    volumes:
      - ./data/mlflow:/mlflow
    ports:
      - "127.0.0.1:15001:5001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - gridvision-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gridvision-backend:latest
    container_name: gridvision-backend
    restart: unless-stopped
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=0
      - PORT=5000
      - SECRET_KEY=${SECRET_KEY:-gridvision-production-secret-key-change-in-prod}
      - CORS_ORIGINS=*
      - MODEL_PROVIDER=${MODEL_PROVIDER:-mlflow}
      - MLFLOW_TRACKING_URI=http://mlflow:5001
      - MLFLOW_MODEL_NAME=${MLFLOW_MODEL_NAME:-customer-bill-prediction}
      - MLFLOW_MODEL_ALIAS=${MLFLOW_MODEL_ALIAS:-champion}
      - DATA_PROVIDER=${DATA_PROVIDER:-sample}
    volumes:
      - ./data/mlflow:/mlflow
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - gridvision-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    image: gridvision-frontend:latest
    container_name: gridvision-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - gridvision-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  gridvision-net:
    name: gridvision-net
    driver: bridge
