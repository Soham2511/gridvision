services:
  mlflow:
    image: gridvision-backend:local
    restart: unless-stopped
    build:
      context: ${GRIDVISION_BUILD_CONTEXT:-.}
      dockerfile: Dockerfile.backend
    command:
      - python
      - -m
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - file:///mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5001"
      - --workers
      - "1"
    volumes:
      - ${GRIDVISION_DATA_DIR:?Set GRIDVISION_DATA_DIR}/mlflow:/mlflow
    ports:
      - "127.0.0.1:${GRIDVISION_MLFLOW_HOST_PORT:-15001}:5001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    image: gridvision-backend:local
    restart: unless-stopped
    build:
      context: ${GRIDVISION_BUILD_CONTEXT:-.}
      dockerfile: Dockerfile.backend
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your environment}
      GRIDVISION_LOG_DIR: /logs
      MODEL_PROVIDER: ${MODEL_PROVIDER:-mlflow}
      MLFLOW_TRACKING_URI: http://mlflow:5001
      MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME:-customer-bill-prediction}
      MLFLOW_MODEL_ALIAS: ${MLFLOW_MODEL_ALIAS:-champion}
      COMMERCIAL_MLFLOW_MODEL_NAME: ${COMMERCIAL_MLFLOW_MODEL_NAME:-gridvision-commercial-building-forecast}
      GOVERNMENT_MLFLOW_MODEL_NAME: ${GOVERNMENT_MLFLOW_MODEL_NAME:-gridvision-government-load-forecast}
      CUSTOMER_TARIFF_INR_PER_KWH: ${CUSTOMER_TARIFF_INR_PER_KWH:-10.0}
      CUSTOMER_GOLD_DATASET_PATH: /data/gold/customer_gold.parquet
      CUSTOMER_MODEL_METADATA_PATH: /models/customer_bill_prediction.metadata.json
      COMMERCIAL_FORECAST_DATA_PATH: /data/gold/commercial_gold.parquet
      COMMERCIAL_FORECAST_MODEL_PATH: /models/commercial/building_forecast.joblib
      GOVERNMENT_FORECAST_DATA_PATH: /data/government/training_ready_2018.parquet
      GOVERNMENT_FORECAST_MODEL_PATH: /data/government/hybrid_grid_2018.joblib
      CORS_ORIGINS: http://localhost:8082,http://127.0.0.1:8082
    volumes:
      - ${GRIDVISION_DATA_DIR:?Set GRIDVISION_DATA_DIR}/mlflow:/mlflow:ro
      - ${GRIDVISION_DATA_DIR:?Set GRIDVISION_DATA_DIR}/gold:/data/gold:ro
      - ${GRIDVISION_DATA_DIR:?Set GRIDVISION_DATA_DIR}/airflow/government:/data/government:ro
      - ./models/commercial:/models/commercial:ro
      - ./models/customer_bill_prediction.metadata.json:/models/customer_bill_prediction.metadata.json:ro
      - ${GRIDVISION_LOG_DIR:-./logs}:/logs
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/health', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    restart: unless-stopped
    build:
      context: ${GRIDVISION_BUILD_CONTEXT:-.}
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8082/api/v1}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${GRIDVISION_FRONTEND_HOST_PORT:-8082}:80"
